<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="220">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#090d14" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="50%" stop-color="#388bfd" />
      <stop offset="100%" stop-color="#1f6feb" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#388bfd" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#161b22" stroke-width="0.8" opacity="0.6"/>
      <circle cx="30" cy="0" r="1" fill="#30363d" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" rx="12" fill="url(#bg)" stroke="#21262d" stroke-width="1.2" />
  <rect width="100%" height="100%" rx="12" fill="url(#grid)" />

  <!-- Top Accent Line -->
  <path d="M 12 1.2 L 280 1.2" stroke="url(#accent)" stroke-width="2.4" stroke-linecap="round" />
  
  <!-- Subtle decorative HUD elements -->
  <g opacity="0.7">
    <text x="50" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#58a6ff" letter-spacing="2">0x00 // SECURITY RESEARCH &amp; SYSTEMS</text>
    <rect x="750" y="40" width="100" height="22" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <circle cx="762" cy="51" r="3.5" fill="#3fb950" />
    <text x="774" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="10.5" font-weight="600" fill="#8b949e">ONLINE</text>
  </g>

  <!-- Main Title -->
  <text x="48" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'JetBrains Mono', monospace" font-size="44" font-weight="800" fill="#f0f6fc" letter-spacing="-1">dyrnoi404</text>
  <circle cx="280" cy="110" r="4.5" fill="#58a6ff" />

  <!-- Subtitle -->
  <text x="50" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="14.5" font-weight="500" fill="#8b949e">
    Systems Programming <tspan fill="#30363d">|</tspan> Cybersecurity Tooling <tspan fill="#30363d">|</tspan> Local-First AI
  </text>

  <!-- Bottom Terminal Tag -->
  <g opacity="0.85">
    <rect x="50" y="172" width="220" height="24" rx="4" fill="#161b22" stroke="#21262d" stroke-width="1" />
    <text x="62" y="188" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" fill="#79c0ff">$ aegis-ai --local --secure</text>
  </g>

  <!-- Right Decorative Symbol -->
  <g transform="translate(740, 95)" opacity="0.25">
    <path d="M 50 0 L 100 25 L 100 75 L 50 100 L 0 75 L 0 25 Z" fill="none" stroke="#58a6ff" stroke-width="2" />
    <path d="M 50 15 L 85 32 L 85 68 L 50 85 L 15 68 L 15 32 Z" fill="none" stroke="#58a6ff" stroke-width="1" />
    <circle cx="50" cy="50" r="8" fill="#58a6ff" />
  </g>
</svg>
